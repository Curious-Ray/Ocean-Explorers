<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Explorers — Habitat Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #060e1a;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(180deg, rgba(6, 14, 26, 0.95) 0%, rgba(6, 14, 26, 0.7) 100%);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 10;
            border-bottom: 1px solid rgba(61, 245, 196, 0.1);
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8892a4;
            text-decoration: none;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.5px;
            padding: 6px 12px;
            border: 1px solid rgba(136, 146, 164, 0.2);
            border-radius: 6px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            color: #3df5c4;
            border-color: rgba(61, 245, 196, 0.3);
        }

        .top-bar-title {
            font-family: 'Sora', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }

        .top-bar-title span {
            color: #3df5c4;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .view-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border: 1px solid rgba(61, 245, 196, 0.2);
            border-radius: 6px;
            background: rgba(61, 245, 196, 0.05);
            color: #3df5c4;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.5px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .view-toggle:hover {
            background: rgba(61, 245, 196, 0.12);
            border-color: rgba(61, 245, 196, 0.4);
        }

        .species-strip {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90px;
            background: linear-gradient(0deg, rgba(6, 14, 26, 0.95) 0%, rgba(6, 14, 26, 0.7) 100%);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 24px;
            z-index: 10;
            border-top: 1px solid rgba(61, 245, 196, 0.1);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .species-strip::-webkit-scrollbar { display: none; }

        .species-card {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            border: 1px solid rgba(136, 146, 164, 0.15);
            border-radius: 10px;
            background: rgba(10, 20, 40, 0.6);
            cursor: pointer;
            transition: all 0.25s;
            min-width: 160px;
        }

        .species-card:hover {
            border-color: rgba(136, 146, 164, 0.4);
            background: rgba(20, 35, 60, 0.6);
        }

        .species-card.active {
            border-color: rgba(61, 245, 196, 0.5);
            background: rgba(61, 245, 196, 0.08);
            box-shadow: 0 0 20px rgba(61, 245, 196, 0.1);
        }

        .species-icon {
            font-size: 24px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
        }

        .species-info {
            display: flex;
            flex-direction: column;
        }

        .species-name {
            font-family: 'Sora', sans-serif;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .species-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #8892a4;
            letter-spacing: 0.3px;
            margin-top: 2px;
        }

        .species-card.active .species-name { color: #3df5c4; }

        .info-panel {
            position: fixed;
            top: 80px;
            right: 20px;
            width: 320px;
            max-height: calc(100vh - 190px);
            background: rgba(6, 14, 26, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(61, 245, 196, 0.15);
            border-radius: 14px;
            padding: 20px;
            z-index: 10;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(61, 245, 196, 0.2) transparent;
            display: none;
        }

        .info-panel.visible { display: block; }

        .info-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .info-panel-title {
            font-family: 'Sora', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .info-panel-close {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(136, 146, 164, 0.2);
            border-radius: 6px;
            background: none;
            color: #8892a4;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .info-panel-close:hover {
            color: #3df5c4;
            border-color: rgba(61, 245, 196, 0.3);
        }

        .habitat-section {
            margin-bottom: 20px;
        }

        .section-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #3df5c4;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .habitat-item {
            padding: 10px 12px;
            border: 1px solid rgba(136, 146, 164, 0.1);
            border-radius: 8px;
            margin-bottom: 6px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .habitat-item:hover {
            border-color: rgba(136, 146, 164, 0.3);
            background: rgba(20, 35, 60, 0.4);
        }

        .habitat-name {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .habitat-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #8892a4;
            display: flex;
            gap: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
            vertical-align: middle;
        }

        .status-high { background: #4caf50; box-shadow: 0 0 6px rgba(76, 175, 80, 0.5); }
        .status-moderate { background: #ffeb3b; box-shadow: 0 0 6px rgba(255, 235, 59, 0.5); }
        .status-low { background: #ff5252; box-shadow: 0 0 6px rgba(255, 82, 82, 0.5); }

        .migration-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: 1px solid rgba(61, 245, 196, 0.2);
            border-radius: 8px;
            background: rgba(61, 245, 196, 0.05);
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 10px;
        }

        .migration-toggle:hover {
            background: rgba(61, 245, 196, 0.1);
        }

        .migration-toggle.active {
            border-color: rgba(61, 245, 196, 0.5);
            background: rgba(61, 245, 196, 0.12);
        }

        .migration-toggle-label {
            font-size: 12px;
            font-weight: 500;
            color: #3df5c4;
        }

        .timing-item {
            display: flex;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(136, 146, 164, 0.08);
        }

        .timing-item:last-child { border-bottom: none; }

        .timing-month {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #3df5c4;
            min-width: 60px;
            flex-shrink: 0;
        }

        .timing-note {
            font-size: 12px;
            color: #c0c8d4;
        }

        .legend {
            position: fixed;
            bottom: 110px;
            left: 20px;
            background: rgba(6, 14, 26, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(61, 245, 196, 0.1);
            border-radius: 10px;
            padding: 14px 18px;
            z-index: 10;
        }

        .legend-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #3df5c4;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .legend-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            font-size: 11px;
            color: #8892a4;
        }

        .legend-row:last-child { margin-bottom: 0; }

        .mapboxgl-popup-content {
            background: rgba(6, 14, 26, 0.95) !important;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(61, 245, 196, 0.2) !important;
            border-radius: 10px !important;
            padding: 14px 16px !important;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5) !important;
            max-width: 260px;
        }

        .mapboxgl-popup-tip {
            border-top-color: rgba(6, 14, 26, 0.95) !important;
        }

        .mapboxgl-popup-close-button {
            color: #8892a4 !important;
            font-size: 18px !important;
            right: 8px !important;
            top: 8px !important;
        }

        .mapboxgl-popup-close-button:hover { color: #3df5c4 !important; }

        .popup-name {
            font-family: 'Sora', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 6px;
        }

        .popup-row {
            font-size: 11px;
            color: #8892a4;
            margin-bottom: 3px;
            font-family: 'JetBrains Mono', monospace;
        }

        .popup-row span { color: #c0c8d4; }

        .popup-notes {
            font-size: 12px;
            color: #c0c8d4;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(136, 146, 164, 0.1);
            line-height: 1.5;
        }

        .habitat-marker {
            position: relative;
            cursor: pointer;
        }

        .habitat-marker .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            animation: drop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            transition: box-shadow 0.25s, filter 0.25s, transform 0.2s;
        }

        .habitat-marker:hover .dot {
            box-shadow: 0 0 16px 4px currentColor;
            filter: brightness(1.3);
            transform: scale(1.3);
        }

        .habitat-marker::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 14px;
            height: 14px;
            margin-top: -7px;
            margin-left: -7px;
            border-radius: 50%;
            border: 2px solid currentColor;
            animation: pulse-ring 2.5s ease-out infinite;
            pointer-events: none;
        }

        @keyframes pulse-ring {
            0%   { transform: scale(0.8); opacity: 0.7; }
            100% { transform: scale(2.8); opacity: 0; }
        }

        @keyframes drop-in {
            0%   { transform: scale(0) translateY(-20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            .habitat-marker::after { animation: none; opacity: 0; }
            .habitat-marker .dot { animation: none; opacity: 1; }
        }

        .mapboxgl-ctrl-attrib { display: none !important; }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="top-bar">
        <div class="top-bar-left">
            <a href="index.html" class="back-btn">← BACK</a>
            <div class="top-bar-title">OCEAN EXPLORERS — <span>HABITAT MAP</span></div>
        </div>
        <div class="top-bar-right">
            <a href="map-2d.html" class="view-toggle">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v18"/></svg>
                2D MAP
            </a>
        </div>
    </div>

    <div class="species-strip" id="species-strip"></div>

    <div class="info-panel" id="info-panel">
        <div class="info-panel-header">
            <div class="info-panel-title" id="panel-title"></div>
            <button class="info-panel-close" id="panel-close">✕</button>
        </div>
        <div id="panel-content"></div>
    </div>

    <div class="legend">
        <div class="legend-title">Population Density</div>
        <div class="legend-row"><span class="status-dot status-high"></span> High / Thriving</div>
        <div class="legend-row"><span class="status-dot status-moderate"></span> Moderate</div>
        <div class="legend-row"><span class="status-dot status-low"></span> Low / Critical</div>
    </div>

    <script src="https://unpkg.com/@turf/turf@7/turf.min.js"></script>
    <script type="module">
        import { creatureMapData } from './js/map-data.js';

        await import('./js/config.js').catch(() => {});
        if (!window.MAPBOX_TOKEN) {
            document.getElementById('map').innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:16px;padding:40px;text-align:center">
                    <div style="font-family:'Sora',sans-serif;font-size:24px;color:#ff5252">Mapbox Token Missing</div>
                    <div style="font-size:14px;color:#8892a4;max-width:440px">
                        Create js/config.js locally or set the MAPBOX_TOKEN GitHub secret for deployment.
                    </div>
                    <a href="index.html" class="back-btn" style="margin-top:12px;text-decoration:none;color:#3df5c4;border:1px solid rgba(61,245,196,0.3);padding:8px 16px;border-radius:6px">Back to Ocean Explorers</a>
                </div>
            `;
            throw new Error('Mapbox token missing');
        }
        mapboxgl.accessToken = window.MAPBOX_TOKEN;

        const MAP_LOAD_LIMIT = 45000;
        const MONTH_KEY = () => `mapbox_loads_${new Date().getFullYear()}_${new Date().getMonth()}`;

        function getLoadCount() {
            return parseInt(localStorage.getItem(MONTH_KEY()) || '0');
        }

        function incrementLoadCount() {
            const count = getLoadCount() + 1;
            localStorage.setItem(MONTH_KEY(), count.toString());
            return count;
        }

        const currentLoads = incrementLoadCount();
        if (currentLoads > MAP_LOAD_LIMIT) {
            document.getElementById('map').innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:16px;padding:40px;text-align:center">
                    <div style="font-family:'Sora',sans-serif;font-size:24px;color:#ff5252">Map Load Limit Reached</div>
                    <div style="font-size:14px;color:#8892a4;max-width:400px">
                        This month's map loads (${currentLoads.toLocaleString()}) have exceeded the safety limit of ${MAP_LOAD_LIMIT.toLocaleString()}.
                        The map is disabled to avoid charges. It will reset automatically next month.
                    </div>
                    <a href="index.html" class="back-btn" style="margin-top:12px;text-decoration:none;color:#3df5c4;border:1px solid rgba(61,245,196,0.3);padding:8px 16px;border-radius:6px">← Back to Ocean Explorers</a>
                </div>
            `;
            throw new Error('Map load limit exceeded');
        }

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11',
            center: [0, 20],
            zoom: 1.8,
            projection: 'globe',
            antialias: true,
        });

        map.on('style.load', () => {
            map.setFog({
                color: 'rgba(6, 14, 26, 1)',
                'high-color': 'rgba(20, 40, 80, 1)',
                'horizon-blend': 0.08,
                'space-color': 'rgba(3, 7, 15, 1)',
                'star-intensity': 0.4,
            });
        });

        let activeCreature = null;
        let migrationVisible = false;
        let animationFrame = null;
        let landGeoJSON = null;
        const markers = [];

        async function loadLandData() {
            try {
                const resp = await fetch('./js/ne_50m_land.json');
                landGeoJSON = await resp.json();
            } catch (e) {
                console.warn('Land polygon validation unavailable:', e);
            }
        }

        function isOnLand(coord) {
            if (!landGeoJSON) return false;
            const pt = turf.point(coord);
            for (const feature of landGeoJSON.features) {
                if (turf.booleanPointInPolygon(pt, feature)) return true;
            }
            return false;
        }

        function validateRoute(coords) {
            if (!landGeoJSON) return coords;

            const flags = coords.map(c => isOnLand(c));
            if (!flags.some(Boolean)) return coords;

            const groups = [];
            let gi = 0;
            while (gi < flags.length) {
                if (flags[gi]) {
                    const start = gi;
                    while (gi < flags.length && flags[gi]) gi++;
                    groups.push({ start, end: gi - 1 });
                } else {
                    gi++;
                }
            }

            const result = coords.map(c => [...c]);

            for (const group of groups) {
                const entryCoord = group.start > 0 ? coords[group.start - 1] : coords[group.start];
                const exitCoord = group.end < coords.length - 1 ? coords[group.end + 1] : coords[group.end];
                const bearing = turf.bearing(turf.point(entryCoord), turf.point(exitCoord));

                const midIdx = Math.floor((group.start + group.end) / 2);
                let bestSide = 90;
                for (const side of [90, -90]) {
                    for (let d = 50; d <= 300; d += 50) {
                        const test = turf.destination(turf.point(coords[midIdx]), d, bearing + side, { units: 'kilometers' });
                        if (!isOnLand(test.geometry.coordinates)) { bestSide = side; break; }
                    }
                    if (bestSide === side) break;
                }

                for (let j = group.start; j <= group.end; j++) {
                    let nudged = false;
                    const angles = [bestSide, -bestSide, bestSide * 0.5, -bestSide * 0.5];
                    for (const angle of angles) {
                        for (let dist = 30; dist <= 500; dist += 30) {
                            const dest = turf.destination(turf.point(coords[j]), dist, bearing + angle, { units: 'kilometers' });
                            if (!isOnLand(dest.geometry.coordinates)) {
                                result[j] = dest.geometry.coordinates;
                                nudged = true;
                                break;
                            }
                        }
                        if (nudged) break;
                    }
                }
            }

            return result;
        }

        function getStatusClass(pop) {
            if (pop === 'high') return 'status-high';
            if (pop === 'low') return 'status-low';
            return 'status-moderate';
        }

        function getMarkerColor(pop) {
            if (pop === 'high') return '#4caf50';
            if (pop === 'low') return '#ff5252';
            return '#ffeb3b';
        }

        function clearMarkers() {
            markers.forEach(m => m.remove());
            markers.length = 0;
        }

        function clearMigration() {
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
            if (map.getLayer('migration-line')) map.removeLayer('migration-line');
            if (map.getLayer('migration-arrow')) map.removeLayer('migration-arrow');
            if (map.getLayer('migration-glow')) map.removeLayer('migration-glow');
            if (map.getSource('migration-route')) map.removeSource('migration-route');
            if (map.getLayer('migration-animated')) map.removeLayer('migration-animated');
            if (map.getSource('migration-animated')) map.removeSource('migration-animated');
            migrationVisible = false;
        }

        function addHabitatMarkers(creature) {
            clearMarkers();
            creature.habitats.forEach((h, i) => {
                const el = document.createElement('div');
                el.className = 'habitat-marker';
                el.style.color = getMarkerColor(h.population);

                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.style.background = getMarkerColor(h.population);
                dot.style.boxShadow = `0 0 8px ${getMarkerColor(h.population)}80`;
                dot.style.animationDelay = `${i * 100}ms`;
                el.appendChild(dot);

                const popup = new mapboxgl.Popup({ offset: 12, closeButton: true })
                    .setHTML(`
                        <div class="popup-name">${h.name}</div>
                        <div class="popup-row">Status: <span>${h.status}</span></div>
                        <div class="popup-row">Population: <span><span class="status-dot ${getStatusClass(h.population)}" style="margin-right:2px"></span>${h.population}</span></div>
                        <div class="popup-row">Season: <span>${h.season}</span></div>
                        <div class="popup-notes">${h.notes}</div>
                    `);

                const marker = new mapboxgl.Marker({ element: el })
                    .setLngLat(h.coords)
                    .setPopup(popup)
                    .addTo(map);

                markers.push(marker);
            });
        }

        function smoothRoute(coords) {
            const validWaypoints = validateRoute(coords);
            const line = turf.lineString(validWaypoints);
            const curved = turf.bezierSpline(line, { resolution: 10000, sharpness: 0.85 });
            return validateRoute(curved.geometry.coordinates);
        }

        function showMigrationRoute(creature) {
            clearMigration();
            if (!creature.migration) return;

            migrationVisible = true;
            const rawRoute = creature.migration.route;
            const route = smoothRoute(rawRoute);

            const fullRoute = {
                type: 'Feature',
                geometry: { type: 'LineString', coordinates: route }
            };

            map.addSource('migration-route', { type: 'geojson', data: fullRoute });

            map.addLayer({
                id: 'migration-glow',
                type: 'line',
                source: 'migration-route',
                paint: {
                    'line-color': creature.color,
                    'line-width': 6,
                    'line-opacity': 0.2,
                    'line-blur': 4,
                }
            });

            map.addLayer({
                id: 'migration-line',
                type: 'line',
                source: 'migration-route',
                paint: {
                    'line-color': creature.color,
                    'line-width': 2.5,
                    'line-opacity': 0.8,
                    'line-dasharray': [2, 2],
                }
            });

            const animatedRoute = {
                type: 'Feature',
                geometry: { type: 'LineString', coordinates: [route[0]] }
            };

            map.addSource('migration-animated', { type: 'geojson', data: animatedRoute });

            map.addLayer({
                id: 'migration-animated',
                type: 'line',
                source: 'migration-animated',
                paint: {
                    'line-color': '#3df5c4',
                    'line-width': 3,
                    'line-opacity': 1,
                }
            });

            let step = 0;
            const totalSteps = 200;

            function animate() {
                step++;
                if (step > totalSteps) step = 0;

                const progress = step / totalSteps;
                const endIdx = Math.max(1, Math.floor(progress * route.length));
                const partialRoute = route.slice(0, endIdx + 1);

                map.getSource('migration-animated').setData({
                    type: 'Feature',
                    geometry: { type: 'LineString', coordinates: partialRoute }
                });

                animationFrame = requestAnimationFrame(animate);
            }

            animate();
        }

        function hideMigrationRoute() {
            clearMigration();
        }

        function flyToCreature(creature) {
            const habitats = creature.habitats;
            if (habitats.length === 0) return;

            map.flyTo({ center: habitats[0].coords, zoom: 1.5, duration: 2000 });
        }

        function renderInfoPanel(creature) {
            const panel = document.getElementById('info-panel');
            const title = document.getElementById('panel-title');
            const content = document.getElementById('panel-content');

            title.textContent = creature.name;
            panel.classList.add('visible');

            let html = '<div class="habitat-section">';
            html += '<div class="section-label">Habitats</div>';
            creature.habitats.forEach(h => {
                html += `
                    <div class="habitat-item" data-lng="${h.coords[0]}" data-lat="${h.coords[1]}">
                        <div class="habitat-name"><span class="status-dot ${getStatusClass(h.population)}"></span>${h.name}</div>
                        <div class="habitat-meta">
                            <span>${h.status}</span>
                            <span>${h.season}</span>
                        </div>
                    </div>
                `;
            });
            html += '</div>';

            /* Migration route UI hidden on 3D globe — see map-2d.html
            if (creature.migration) {
                html += `
                    <div class="habitat-section">
                        <div class="section-label">Migration Route</div>
                        <div class="migration-toggle ${migrationVisible ? 'active' : ''}" id="migration-toggle">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <path d="M2 14L6 6L10 10L14 2" stroke="#3df5c4" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                            <span class="migration-toggle-label">${migrationVisible ? 'Hide Route' : 'Show Route'}</span>
                        </div>
                `;

                creature.migration.timing.forEach(t => {
                    html += `
                        <div class="timing-item">
                            <div class="timing-month">${t.month}</div>
                            <div class="timing-note">${t.note}</div>
                        </div>
                    `;
                });

                html += '</div>';
            }
            */

            content.innerHTML = html;

            content.querySelectorAll('.habitat-item').forEach(item => {
                item.addEventListener('click', () => {
                    const lng = parseFloat(item.dataset.lng);
                    const lat = parseFloat(item.dataset.lat);
                    map.flyTo({ center: [lng, lat], zoom: 3, duration: 1500 });
                });
            });

            const toggle = document.getElementById('migration-toggle');
            if (toggle) {
                toggle.addEventListener('click', () => {
                    if (migrationVisible) {
                        hideMigrationRoute();
                        toggle.classList.remove('active');
                        toggle.querySelector('.migration-toggle-label').textContent = 'Show Route';
                    } else {
                        showMigrationRoute(creature);
                        toggle.classList.add('active');
                        toggle.querySelector('.migration-toggle-label').textContent = 'Hide Route';
                    }
                });
            }
        }

        function selectCreature(id) {
            const creature = creatureMapData.find(c => c.id === id);
            if (!creature) return;

            activeCreature = creature;
            clearMigration();

            document.querySelectorAll('.species-card').forEach(card => {
                card.classList.toggle('active', card.dataset.id === id);
            });

            addHabitatMarkers(creature);
            flyToCreature(creature);
            renderInfoPanel(creature);
        }

        function buildSpeciesStrip() {
            const strip = document.getElementById('species-strip');
            creatureMapData.forEach(c => {
                const card = document.createElement('div');
                card.className = 'species-card';
                card.dataset.id = c.id;
                card.innerHTML = `
                    <div class="species-icon">${c.icon}</div>
                    <div class="species-info">
                        <div class="species-name">${c.name.toUpperCase()}</div>
                        <div class="species-tag">${c.habitats.length} habitats</div>
                    </div>
                `;
                card.addEventListener('click', () => selectCreature(c.id));
                strip.appendChild(card);
            });
        }

        document.getElementById('panel-close').addEventListener('click', () => {
            document.getElementById('info-panel').classList.remove('visible');
            clearMigration();
            clearMarkers();
            document.querySelectorAll('.species-card').forEach(c => c.classList.remove('active'));
            activeCreature = null;
            map.flyTo({ center: [0, 20], zoom: 1.8, duration: 2000 });
        });

        map.on('load', async () => {
            // Land polygon + migration routes disabled on 3D globe (GPU-heavy).
            // See map-2d.html for the 2D habitat map with routes.
            // await loadLandData();
            buildSpeciesStrip();
        });
    </script>
</body>
</html>
