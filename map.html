<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Ocean Explorers — Habitat Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #060e1a;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .habitat-pulse-marker {
            --pulse-badge-size: 24px;
            position: absolute;
            width: 0;
            height: 0;
            overflow: visible;
            pointer-events: none;
        }

        .habitat-pulse-svg {
            position: absolute;
            left: 0;
            top: 0;
            width: calc(var(--pulse-badge-size) * 2.15);
            height: calc(var(--pulse-badge-size) * 2.15);
            overflow: visible;
            transform: translate(-50%, -50%);
        }

        .habitat-pulse-ring {
            fill: none;
            stroke: var(--pulse-color, #3df5c4);
            stroke-width: 3px;
            opacity: 0.98;
            vector-effect: non-scaling-stroke;
            transform-box: fill-box;
            transform-origin: center;
            animation: habitat-pulse-ring 2s linear infinite;
            will-change: stroke-width, transform;
        }

        .migration-route-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
            z-index: 2;
        }

        .migration-route-flow {
            fill: none;
            stroke: var(--route-flow-color, #3df5c4);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 2 12;
            opacity: 0.9;
        }

        .migration-route-tracer {
            fill: var(--route-flow-color, #3df5c4);
            opacity: 0.95;
        }

        @keyframes habitat-pulse-ring {
            0% {
                stroke-width: 3px;
                transform: scale(1);
            }
            88% {
                stroke-width: 0;
                transform: scale(2.15);
            }
            100% {
                stroke-width: 0;
                transform: scale(2.15);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .habitat-pulse-ring {
                animation: none;
            }

            .migration-route-tracer {
                display: none;
            }
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(180deg, rgba(6, 14, 26, 0.95) 0%, rgba(6, 14, 26, 0.7) 100%);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 10;
            border-bottom: 1px solid rgba(61, 245, 196, 0.1);
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8892a4;
            text-decoration: none;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.5px;
            padding: 6px 12px;
            border: 1px solid rgba(136, 146, 164, 0.2);
            border-radius: 6px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            color: #3df5c4;
            border-color: rgba(61, 245, 196, 0.3);
        }

        .top-bar-title {
            font-family: 'Sora', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }

        .top-bar-title span {
            color: #3df5c4;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .view-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border: 1px solid rgba(61, 245, 196, 0.2);
            border-radius: 6px;
            background: rgba(61, 245, 196, 0.05);
            color: #3df5c4;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.5px;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
        }

        .view-toggle:hover {
            background: rgba(61, 245, 196, 0.12);
            border-color: rgba(61, 245, 196, 0.4);
        }

        button.view-toggle {
            font: inherit;
        }

        .view-toggle.active {
            background: rgba(61, 245, 196, 0.12);
            border-color: rgba(61, 245, 196, 0.45);
            color: #bafded;
        }

        .view-toggle:not(.active).pin-toggle {
            border-color: rgba(136, 146, 164, 0.22);
            background: rgba(136, 146, 164, 0.06);
            color: #8892a4;
        }

        .species-strip {
            position: fixed;
            top: 80px;
            bottom: 20px;
            left: 20px;
            width: 260px;
            background: rgba(6, 14, 26, 0.9);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
            padding: 12px;
            z-index: 10;
            border: 1px solid rgba(61, 245, 196, 0.12);
            border-radius: 10px;
            overflow-x: hidden;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(61, 245, 196, 0.3) rgba(255, 255, 255, 0.05);
        }

        .species-strip::-webkit-scrollbar { width: 8px; height: 8px; }
        .species-strip::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 8px; }
        .species-strip::-webkit-scrollbar-thumb { background: rgba(61, 245, 196, 0.3); border-radius: 8px; }
        .species-strip::-webkit-scrollbar-thumb:hover { background: rgba(61, 245, 196, 0.5); }

        .species-card {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            min-height: 60px;
            padding: 10px 12px;
            border: 1px solid rgba(136, 146, 164, 0.15);
            border-radius: 8px;
            background: rgba(10, 20, 40, 0.6);
            color: inherit;
            font: inherit;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s;
        }

        .species-card:hover {
            border-color: rgba(136, 146, 164, 0.4);
            background: rgba(20, 35, 60, 0.6);
        }

        .species-card.active {
            border-color: rgba(61, 245, 196, 0.5);
            background: rgba(61, 245, 196, 0.08);
            box-shadow: 0 0 20px rgba(61, 245, 196, 0.1);
        }

        .species-card:focus-visible {
            outline: 2px solid rgba(61, 245, 196, 0.85);
            outline-offset: 2px;
        }

        .species-icon {
            font-size: 24px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
        }

        .species-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        .species-name {
            font-family: 'Sora', sans-serif;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0;
            line-height: 1.2;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        .species-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #8892a4;
            letter-spacing: 0;
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .species-card.active .species-name { color: #3df5c4; }

        .info-panel {
            position: fixed;
            top: 80px;
            right: 20px;
            width: 320px;
            max-height: calc(100vh - 190px);
            background: rgba(6, 14, 26, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(61, 245, 196, 0.15);
            border-radius: 14px;
            padding: 20px;
            z-index: 10;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(61, 245, 196, 0.2) transparent;
            display: none;
        }

        .info-panel.visible { display: block; }

        .info-panel-header {
            position: sticky;
            top: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            background: linear-gradient(180deg, rgba(6, 14, 26, 0.96) 0%, rgba(6, 14, 26, 0.88) 75%, rgba(6, 14, 26, 0) 100%);
        }

        .info-panel-title {
            font-family: 'Sora', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .info-panel-close {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(136, 146, 164, 0.2);
            border-radius: 6px;
            background: none;
            color: #8892a4;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .info-panel-close:hover {
            color: #3df5c4;
            border-color: rgba(61, 245, 196, 0.3);
        }

        .habitat-section {
            margin-bottom: 20px;
        }

        .section-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #3df5c4;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .habitat-item {
            padding: 10px 12px;
            border: 1px solid rgba(136, 146, 164, 0.1);
            border-radius: 8px;
            margin-bottom: 6px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .habitat-item:hover {
            border-color: rgba(136, 146, 164, 0.3);
            background: rgba(20, 35, 60, 0.4);
        }

        .habitat-name {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .habitat-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #8892a4;
            display: flex;
            gap: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
            vertical-align: middle;
        }

        .status-high { background: #4caf50; box-shadow: 0 0 6px rgba(76, 175, 80, 0.5); }
        .status-moderate { background: #f5a623; box-shadow: 0 0 6px rgba(245, 166, 35, 0.5); }
        .status-low { background: #ff5252; box-shadow: 0 0 6px rgba(255, 82, 82, 0.5); }

        .migration-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: 1px solid rgba(61, 245, 196, 0.2);
            border-radius: 8px;
            background: rgba(61, 245, 196, 0.05);
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 10px;
        }

        .migration-toggle:hover {
            background: rgba(61, 245, 196, 0.1);
        }

        .migration-toggle.active {
            border-color: rgba(61, 245, 196, 0.5);
            background: rgba(61, 245, 196, 0.12);
        }

        .migration-toggle-label {
            font-size: 12px;
            font-weight: 500;
            color: #3df5c4;
        }

        .timing-item {
            display: flex;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(136, 146, 164, 0.08);
        }

        .timing-item:last-child { border-bottom: none; }

        .timing-month {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #3df5c4;
            min-width: 60px;
            flex-shrink: 0;
        }

        .timing-note {
            font-size: 12px;
            color: #c0c8d4;
        }

        .legend {
            position: fixed;
            bottom: 20px;
            left: 300px;
            background: rgba(6, 14, 26, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(61, 245, 196, 0.1);
            border-radius: 10px;
            padding: 14px 18px;
            z-index: 10;
        }

        .legend-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #3df5c4;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .legend-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            font-size: 11px;
            color: #8892a4;
        }

        .legend-row:last-child { margin-bottom: 0; }

        .mapboxgl-popup-content {
            background: rgba(6, 14, 26, 0.95) !important;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(61, 245, 196, 0.2) !important;
            border-radius: 10px !important;
            padding: 14px 16px !important;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5) !important;
            max-width: 260px;
        }

        .mapboxgl-popup-tip {
            border-top-color: rgba(6, 14, 26, 0.95) !important;
        }

        .mapboxgl-popup-close-button {
            color: #8892a4 !important;
            font-size: 18px !important;
            right: 8px !important;
            top: 8px !important;
        }

        .mapboxgl-popup-close-button:hover { color: #3df5c4 !important; }

        .popup-name {
            font-family: 'Sora', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 6px;
        }

        .popup-row {
            font-size: 11px;
            color: #8892a4;
            margin-bottom: 3px;
            font-family: 'JetBrains Mono', monospace;
        }

        .popup-row span { color: #c0c8d4; }

        .popup-notes {
            font-size: 12px;
            color: #c0c8d4;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(136, 146, 164, 0.1);
            line-height: 1.5;
        }

        .mapboxgl-ctrl-attrib { display: none !important; }

        @media (max-width: 1100px) {
            .species-strip {
                width: 220px;
            }

            .species-card {
                min-height: 56px;
                padding: 9px 10px;
            }

            .species-icon {
                width: 36px;
                height: 36px;
                font-size: 22px;
            }

            .species-name {
                font-size: 11px;
            }

            .legend {
                left: 260px;
            }
        }

        @media (max-width: 900px) {
            .species-strip {
                top: auto;
                bottom: 0;
                left: 0;
                right: 0;
                width: auto;
                height: 96px;
                flex-direction: row;
                align-items: center;
                padding: 0 16px;
                border-radius: 0;
                border-left: 0;
                border-right: 0;
                border-bottom: 0;
                border-top: 1px solid rgba(61, 245, 196, 0.12);
                background: linear-gradient(0deg, rgba(6, 14, 26, 0.96) 0%, rgba(6, 14, 26, 0.76) 100%);
                overflow-x: auto;
                overflow-y: hidden;
                scroll-snap-type: x proximity;
                scroll-padding-inline: 16px;
            }

            .species-card {
                flex: 0 0 178px;
                width: 178px;
                min-height: 62px;
                scroll-snap-align: start;
            }

            .info-panel {
                right: 12px;
                left: 12px;
                width: auto;
                max-height: calc(100vh - 316px);
            }

            .legend {
                left: 16px;
                bottom: 112px;
            }
        }

        @media (max-width: 640px) {
            .top-bar {
                padding: 0 12px;
            }

            .top-bar-left {
                gap: 8px;
                min-width: 0;
            }

            .top-bar-title {
                font-size: 12px;
                letter-spacing: 0.5px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .back-btn,
            .view-toggle {
                padding: 6px 8px;
                font-size: 10px;
            }

            .species-strip {
                height: 92px;
            }

            .species-card {
                flex-basis: 160px;
                width: 160px;
            }

            .species-name {
                white-space: normal;
                line-height: 1.2;
            }
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="top-bar">
        <div class="top-bar-left">
            <a href="index.html" class="back-btn">← BACK</a>
            <div class="top-bar-title">OCEAN EXPLORERS — <span>HABITAT MAP</span></div>
        </div>
        <div class="top-bar-right">
            <button class="view-toggle pin-toggle active" id="all-pins-toggle" type="button" aria-pressed="true">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 21s6-5.4 6-11a6 6 0 1 0-12 0c0 5.6 6 11 6 11z"/>
                    <circle cx="12" cy="10" r="2"/>
                </svg>
                <span> PINS ON</span>
            </button>
            <a href="map-2d.html" class="view-toggle">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v18"/></svg>
                2D MAP
            </a>
        </div>
    </div>

    <nav class="species-strip" id="species-strip" aria-label="Species"></nav>

    <div class="info-panel" id="info-panel">
        <div class="info-panel-header">
            <div class="info-panel-title" id="panel-title"></div>
            <button class="info-panel-close" id="panel-close">✕</button>
        </div>
        <div id="panel-content"></div>
    </div>

    <div class="legend">
        <div class="legend-title">Population Density</div>
        <div class="legend-row"><span class="status-dot status-high"></span> High / Thriving</div>
        <div class="legend-row"><span class="status-dot status-moderate"></span> Moderate</div>
        <div class="legend-row"><span class="status-dot status-low"></span> Low / Critical</div>
    </div>

    <script src="https://unpkg.com/@turf/turf@7/turf.min.js"></script>
    <script type="module">
        import { creatureMapData } from './js/map-data.js';

        await import('./js/config.js').catch(() => {});
        if (!window.MAPBOX_TOKEN) {
            document.getElementById('map').innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:16px;padding:40px;text-align:center">
                    <div style="font-family:'Sora',sans-serif;font-size:24px;color:#ff5252">Mapbox Token Missing</div>
                    <div style="font-size:14px;color:#8892a4;max-width:440px">
                        Create js/config.js locally or set the MAPBOX_TOKEN GitHub secret for deployment.
                    </div>
                    <a href="index.html" class="back-btn" style="margin-top:12px;text-decoration:none;color:#3df5c4;border:1px solid rgba(61,245,196,0.3);padding:8px 16px;border-radius:6px">Back to Ocean Explorers</a>
                </div>
            `;
            throw new Error('Mapbox token missing');
        }
        mapboxgl.accessToken = window.MAPBOX_TOKEN;

        const MAP_LOAD_LIMIT = 45000;
        const MONTH_KEY = () => `mapbox_loads_${new Date().getFullYear()}_${new Date().getMonth()}`;

        function getLoadCount() {
            return parseInt(localStorage.getItem(MONTH_KEY()) || '0');
        }

        function incrementLoadCount() {
            const count = getLoadCount() + 1;
            localStorage.setItem(MONTH_KEY(), count.toString());
            return count;
        }

        const currentLoads = incrementLoadCount();
        if (currentLoads > MAP_LOAD_LIMIT) {
            document.getElementById('map').innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:16px;padding:40px;text-align:center">
                    <div style="font-family:'Sora',sans-serif;font-size:24px;color:#ff5252">Map Load Limit Reached</div>
                    <div style="font-size:14px;color:#8892a4;max-width:400px">
                        This month's map loads (${currentLoads.toLocaleString()}) have exceeded the safety limit of ${MAP_LOAD_LIMIT.toLocaleString()}.
                        The map is disabled to avoid charges. It will reset automatically next month.
                    </div>
                    <a href="index.html" class="back-btn" style="margin-top:12px;text-decoration:none;color:#3df5c4;border:1px solid rgba(61,245,196,0.3);padding:8px 16px;border-radius:6px">← Back to Ocean Explorers</a>
                </div>
            `;
            throw new Error('Map load limit exceeded');
        }

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11',
            center: [0, 20],
            zoom: 1.8,
            projection: 'globe',
            // antialias left at default (false) — MSAA on the globe is GPU/VRAM-heavy
            // and not visibly needed for this dark, low-detail basemap.
        });

        map.on('style.load', () => {
            map.setFog({
                color: 'rgba(6, 14, 26, 1)',
                'high-color': 'rgba(20, 40, 80, 1)',
                'horizon-blend': 0.08,
                'space-color': 'rgba(3, 7, 15, 1)',
                'star-intensity': 0.4,
            });
            loadHabitatIconImages();
        });

        let activeCreature = null;
        let migrationVisible = false;
        let allHabitatPinsEnabled = true;
        let habitatPulseMarkers = [];
        let habitatPulseSizeFrame = null;
        let migrationRouteOverlay = null;
        let routeOverlayUpdateFrame = null;
        let activeHabitatPopup = null;
        let landGeoJSON = null;
        let landFeatureIndex = [];

        const HABITAT_SOURCE_ID = 'habitat-points';
        const HABITAT_HALO_LAYER_ID = 'habitat-points-halo';
        const HABITAT_DOT_LAYER_ID = 'habitat-points-dot';
        const HABITAT_ICON_LAYER_ID = 'habitat-icon-layer';
        const ALL_HABITAT_SOURCE_ID = 'all-habitat-points';
        const ALL_HABITAT_CLUSTER_LAYER_ID = 'all-habitat-clusters';
        const ALL_HABITAT_CLUSTER_COUNT_LAYER_ID = 'all-habitat-cluster-count';
        const ALL_HABITAT_HALO_LAYER_ID = 'all-habitat-points-halo';
        const ALL_HABITAT_DOT_LAYER_ID = 'all-habitat-points-dot';
        const ALL_HABITAT_ICON_LAYER_ID = 'all-habitat-icon-layer';
        const HABITAT_ICON_IMAGE_NAMES = [
            'whale-tail',
            'sperm-whale',
            'octopus',
            'manta-ray',
            'sea-turtle',
            'hammerhead',
            'whale-shark',
            'orca',

        ];
        const LAND_DATA_URL = './js/ne_110m_land.json';
        const ROUTE_LAND_SAMPLE_KM = 35;
        const habitatIconImageData = new Map();
        const habitatIconImageLoads = new Set();

        function getGeometryBbox(geometry) {
            const bbox = [Infinity, Infinity, -Infinity, -Infinity];

            function visit(coords) {
                if (typeof coords[0] === 'number') {
                    bbox[0] = Math.min(bbox[0], coords[0]);
                    bbox[1] = Math.min(bbox[1], coords[1]);
                    bbox[2] = Math.max(bbox[2], coords[0]);
                    bbox[3] = Math.max(bbox[3], coords[1]);
                    return;
                }
                coords.forEach(visit);
            }

            visit(geometry.coordinates);
            return bbox;
        }

        async function loadLandData() {
            try {
                const resp = await fetch(LAND_DATA_URL);
                if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);

                landGeoJSON = await resp.json();
                landFeatureIndex = landGeoJSON.features.map(feature => ({
                    feature,
                    bbox: feature.bbox || getGeometryBbox(feature.geometry),
                }));
            } catch (e) {
                console.warn('Land polygon validation unavailable:', e);
                landGeoJSON = null;
                landFeatureIndex = [];
            }
        }

        function isInsideBbox(coord, bbox) {
            return coord[0] >= bbox[0] && coord[0] <= bbox[2]
                && coord[1] >= bbox[1] && coord[1] <= bbox[3];
        }

        function isOnLand(coord) {
            if (!landFeatureIndex.length) return false;

            const pt = turf.point(coord);
            return landFeatureIndex.some(({ feature, bbox }) => (
                isInsideBbox(coord, bbox) && turf.booleanPointInPolygon(pt, feature)
            ));
        }

        function addHabitatIconImage(name, imageData) {
            const id = `habitat-icon-${name}`;
            if (map.hasImage(id)) return;

            } catch (e) {
                console.warn(`Failed to add habitat icon image: ${id}`, e);
            }
        }

        function loadHabitatIconImages() {
            HABITAT_ICON_IMAGE_NAMES.forEach(name => {
                const id = `habitat-icon-${name}`;
                if (map.hasImage(id)) return;

                const cachedImageData = habitatIconImageData.get(name);
                if (cachedImageData) {
                    addHabitatIconImage(name, cachedImageData);
                    return;
                }

                if (habitatIconImageLoads.has(name)) return;
                habitatIconImageLoads.add(name);

                const image = new Image();
                image.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = 64;
                        canvas.height = 64;
                        const ctx = canvas.getContext('2d');
                        if (!ctx) return;

                        ctx.clearRect(0, 0, 64, 64);
                        ctx.drawImage(image, 0, 0, 64, 64);

                        const imageData = ctx.getImageData(0, 0, 64, 64);
                        habitatIconImageData.set(name, imageData);
                        addHabitatIconImage(name, imageData);
                    } catch (e) {
                        console.warn(`Failed to prepare habitat icon image: ${id}`, e);
                    }
                };
                image.onerror = () => {
                    habitatIconImageLoads.delete(name);
                    console.warn(`Failed to load habitat icon image: ${id}`);
                };
                image.src = `assets/icons/${name}.svg`;
            });
        }

        function zoomToAllHabitatCluster(feature) {
            const source = map.getSource(ALL_HABITAT_SOURCE_ID);
            if (!source || typeof source.getClusterExpansionZoom !== 'function') return;

            const clusterId = feature.properties.cluster_id;
            const center = feature.geometry.coordinates.slice();
            let handled = false;

            const applyZoom = (zoom) => {
                if (handled || typeof zoom !== 'number') return;
                handled = true;
                map.easeTo({
                    center,
                    zoom: Math.min(zoom + 0.2, 5),
                    duration: 700,
                });
            };

            const onExpansionZoom = (err, zoom) => {
                if (err) {
                    console.warn('Unable to expand habitat cluster:', err);
                    return;
                }
                applyZoom(zoom);
            };

            try {
                const result = source.getClusterExpansionZoom(clusterId, onExpansionZoom);
                if (typeof result === 'number') {
                    applyZoom(result);
                } else if (result && typeof result.then === 'function') {
                    result.then(applyZoom).catch(err => {
                        console.warn('Unable to expand habitat cluster:', err);
                    });
                }
            } catch (err) {
                console.warn('Unable to expand habitat cluster:', err);
            }
        }

        function sampleRouteForOverlay(route, maxPoints = 180) {
            if (route.length <= maxPoints) return route;

            const samples = [];
            const stride = (route.length - 1) / (maxPoints - 1);
            for (let i = 0; i < maxPoints; i++) {
                samples.push(route[Math.round(i * stride)]);
            }
            return samples;
        }

        function formatMigrationRouteOverlayPath(coords) {
            const width = map.getCanvas().clientWidth || map.getContainer().clientWidth;
            const height = map.getCanvas().clientHeight || map.getContainer().clientHeight;
            const jumpLimit = Math.max(width, height) * 1.35;
            let previousPoint = null;
            let pathData = '';

            coords.forEach(coord => {
                const point = map.project(coord);
                if (!Number.isFinite(point.x) || !Number.isFinite(point.y)) return;

                const x = Number(point.x.toFixed(1));
                const y = Number(point.y.toFixed(1));
                const shouldRestart = !previousPoint || Math.hypot(x - previousPoint.x, y - previousPoint.y) > jumpLimit;
                pathData += `${shouldRestart ? 'M' : 'L'}${x} ${y} `;
                previousPoint = { x, y };
            });

            return pathData;
        }

        function updateMigrationRouteOverlay() {
            if (!migrationRouteOverlay) return;

            const width = map.getCanvas().clientWidth || map.getContainer().clientWidth;
            const height = map.getCanvas().clientHeight || map.getContainer().clientHeight;
            const pathData = formatMigrationRouteOverlayPath(migrationRouteOverlay.coords);
            migrationRouteOverlay.svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
            migrationRouteOverlay.svg.setAttribute('width', width);
            migrationRouteOverlay.svg.setAttribute('height', height);
            migrationRouteOverlay.path.setAttribute('d', pathData);
            migrationRouteOverlay.tracers.forEach(tracer => {
                tracer.motion.setAttribute('path', pathData);
            });
        }

        function scheduleMigrationRouteOverlayUpdate() {
            if (!migrationRouteOverlay || routeOverlayUpdateFrame) return;

            routeOverlayUpdateFrame = requestAnimationFrame(() => {
                routeOverlayUpdateFrame = null;
                updateMigrationRouteOverlay();
            });

        function clearMigrationRouteOverlay() {

                cancelAnimationFrame(routeOverlayUpdateFrame);
                routeOverlayUpdateFrame = null;
            }

            map.off('resize', scheduleMigrationRouteOverlayUpdate);

        function showAnimatedMigrationRoute(route) {
            clearMigrationRouteOverlay();

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.classList.add('migration-route-overlay');

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.classList.add('migration-route-flow');
            svg.appendChild(path);

            const tracers = [0, -2, -4].map(begin => {
                const tracer = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                tracer.classList.add('migration-route-tracer');
                tracer.setAttribute('r', '3.5');

                motion.setAttribute('dur', '6s');
                motion.setAttribute('repeatCount', 'indefinite');
                motion.setAttribute('begin', `${begin}s`);

                tracer.appendChild(motion);
                svg.appendChild(tracer);
                return { tracer, motion };
            });

            map.getContainer().appendChild(svg);
            migrationRouteOverlay = {
                svg,
                path,
                tracers,
                coords: sampleRouteForOverlay(route),

            updateMigrationRouteOverlay();
            map.on('move', scheduleMigrationRouteOverlayUpdate);

        function normalizeLng(lng) {
            if (lng > 180) return lng - 360;
            if (lng < -180) return lng + 360;
            return lng;
        }

        function interpolateCoord(start, end, t) {
            let lngDelta = end[0] - start[0];
            if (Math.abs(lngDelta) > 180) lngDelta += lngDelta > 0 ? -360 : 360;
            return [
                normalizeLng(start[0] + lngDelta * t),
                start[1] + (end[1] - start[1]) * t,
            ];
        }

        function densifyRoute(coords, intervalKm = ROUTE_LAND_SAMPLE_KM) {
            const samples = [coords[0]];

            for (let i = 0; i < coords.length - 1; i++) {
                const start = coords[i];
                const end = coords[i + 1];
                const distance = turf.distance(turf.point(start), turf.point(end), { units: 'kilometers' });
                const steps = Math.max(1, Math.ceil(distance / intervalKm));

                for (let step = 1; step <= steps; step++) {
                    samples.push(interpolateCoord(start, end, step / steps));
                }
            }

            return samples;
        }

        function getRouteLandHits(coords, maxHits = 5) {
            const hits = [];
            for (const coord of densifyRoute(coords)) {
                if (isOnLand(coord)) {
                    hits.push(coord);
                    if (hits.length >= maxHits) break;
                }
            }
            return hits;
        }

        function createSmoothedRoute(coords, sharpness) {
            const line = turf.lineString(coords);
            return turf.bezierSpline(line, { resolution: 10000, sharpness }).geometry.coordinates;
        }

        // Cache smoothed+validated routes per creature. bezierSpline (resolution 10000,
        // run up to 3x) plus the land checks are expensive, so compute once and reuse.
        const smoothedRouteCache = new Map();

        function smoothRoute(coords, routeLabel) {
            if (smoothedRouteCache.has(routeLabel)) return smoothedRouteCache.get(routeLabel);

            const candidates = [
                { label: 'smooth', coords: createSmoothedRoute(coords, 0.55) },
                { label: 'gentle', coords: createSmoothedRoute(coords, 0.25) },
                { label: 'waypoints', coords: densifyRoute(coords, 80) },
            ];

            // Land data not loaded yet — return the smooth candidate without caching,
            // so a later call can re-validate once the polygons are available.
            if (!landFeatureIndex.length) return candidates[0].coords;

            let result = null;
            for (const candidate of candidates) {
                const landHits = getRouteLandHits(candidate.coords);
                if (!landHits.length) { result = candidate.coords; break; }

                console.warn(`${routeLabel} ${candidate.label} migration route intersects land; trying fallback.`, landHits);
            }

            if (!result) console.warn(`${routeLabel} migration route skipped because every candidate intersects land.`);

            smoothedRouteCache.set(routeLabel, result);
            return result;
        }

        function flyToRouteStart(startCoord) {
            map.flyTo({ center: startCoord, zoom: 2.6, duration: 1600 });
        }

        function showMigrationRoute(creature) {
            clearMigration();
            if (!creature.migration) return false;

            const route = smoothRoute(creature.migration.route, creature.name);
            if (!route) return false;

            migrationVisible = true;
            const startCoord = route[0];

            const fullRoute = {
                type: 'Feature',
                geometry: { type: 'LineString', coordinates: route }
            };

            map.addSource('migration-route', { type: 'geojson', data: fullRoute });

            map.addLayer({
                id: 'migration-glow',
                type: 'line',
                source: 'migration-route',
                paint: {
                    'line-color': creature.color,
                    'line-width': 6,
                    'line-opacity': 0.2,
                    'line-blur': 4,
                }
            });

            map.addLayer({
                id: 'migration-line',
                type: 'line',
                source: 'migration-route',
                paint: {
                    'line-color': creature.color,
                    'line-width': 2.5,
                    'line-opacity': 0.8,
                    'line-dasharray': [2, 2],
                }
            });

            // Static dashed highlight. Continuous Mapbox paint mutations were a
            // measurable CPU hotspot on route-heavy views, so animation lives
            // in a lightweight SVG overlay instead.
            map.addLayer({
                id: 'migration-dashed',
                type: 'line',
                source: 'migration-route',
                paint: {
                    'line-color': '#3df5c4',
                    'line-width': 3,
                    'line-dasharray': [0, 4, 3],
                }
            });

            showAnimatedMigrationRoute(route);
            bringHabitatMarkersToFront();
            flyToRouteStart(startCoord);
            return true;
        }

        function hideMigrationRoute() {
            clearMigration();
        }

        function flyToCreature(creature) {
            const habitats = creature.habitats;
            if (habitats.length === 0) return;

            map.flyTo({ center: habitats[0].coords, zoom: 1.5, duration: 2000 });
        }

        function renderInfoPanel(creature) {
            const panel = document.getElementById('info-panel');
            const title = document.getElementById('panel-title');
            const content = document.getElementById('panel-content');

            title.textContent = creature.name;
            panel.classList.add('visible');

            let html = '<div class="habitat-section">';
            html += '<div class="section-label">Habitats</div>';
            creature.habitats.forEach(h => {
                html += `
                    <div class="habitat-item" data-lng="${h.coords[0]}" data-lat="${h.coords[1]}">
                        <div class="habitat-name"><span class="status-dot ${getStatusClass(h.population)}"></span>${h.name}</div>
                        <div class="habitat-meta">
                            <span>${h.status}</span>
                            <span>${h.season}</span>
                        </div>
                    </div>
                `;
            });
            html += '</div>';

            if (creature.migration) {
                html += `
                    <div class="habitat-section">
                        <div class="section-label">Migration Route</div>
                        <div class="migration-toggle ${migrationVisible ? 'active' : ''}" id="migration-toggle">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <path d="M2 14L6 6L10 10L14 2" stroke="#3df5c4" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                            <span class="migration-toggle-label">${migrationVisible ? 'Hide Route' : 'Show Route'}</span>
                        </div>
                `;

                creature.migration.timing.forEach(t => {
                    html += `
                        <div class="timing-item">
                            <div class="timing-month">${t.month}</div>
                            <div class="timing-note">${t.note}</div>
                        </div>
                    `;
                });

                html += '</div>';
            }

            content.innerHTML = html;
            panel.scrollTop = 0;

            content.querySelectorAll('.habitat-item').forEach(item => {
                item.addEventListener('click', () => {
                    const lng = parseFloat(item.dataset.lng);
                    const lat = parseFloat(item.dataset.lat);
                    map.flyTo({ center: [lng, lat], zoom: 3, duration: 1500 });
                });
            });

            const toggle = document.getElementById('migration-toggle');
            if (toggle) {
                toggle.addEventListener('click', () => {
                    if (migrationVisible) {
                        hideMigrationRoute();
                        toggle.classList.remove('active');
                        toggle.querySelector('.migration-toggle-label').textContent = 'Show Route';
                    } else {
                        if (showMigrationRoute(creature)) {
                            toggle.classList.add('active');
                            toggle.querySelector('.migration-toggle-label').textContent = 'Hide Route';
                        } else {
                            toggle.classList.remove('active');
                            toggle.querySelector('.migration-toggle-label').textContent = 'Route Blocked';
                            window.setTimeout(() => {
                                toggle.querySelector('.migration-toggle-label').textContent = 'Show Route';
                            }, 1600);
                        }
                    }
                });
            }
        }

        function selectCreature(id) {
            const creature = creatureMapData.find(c => c.id === id);
            if (!creature) return;

            activeCreature = creature;
            clearMigration();
            clearAllHabitatMarkers();

            document.querySelectorAll('.species-card').forEach(card => {
                const isActive = card.dataset.id === id;
                card.classList.toggle('active', isActive);
                card.setAttribute('aria-pressed', isActive ? 'true' : 'false');
                if (isActive) card.scrollIntoView({ block: 'nearest', inline: 'nearest' });
            });

            addHabitatMarkers(creature);
            flyToCreature(creature);
            renderInfoPanel(creature);
        }

        function buildSpeciesStrip() {
            const strip = document.getElementById('species-strip');
            creatureMapData.forEach(c => {
                const card = document.createElement('button');
                card.type = 'button';
                card.className = 'species-card';
                card.dataset.id = c.id;
                card.setAttribute('aria-pressed', 'false');
                card.innerHTML = `
                    <div class="species-icon">${c.icon}</div>
                    <div class="species-info">
                        <div class="species-name">${c.name.toUpperCase()}</div>
                        <div class="species-tag">${c.habitats.length} habitats${c.migration ? ' • migratory' : ''}</div>
                    </div>
                `;
                card.addEventListener('click', () => selectCreature(c.id));
                strip.appendChild(card);
            });

            strip.addEventListener('wheel', (event) => {
                const isHorizontalStrip = getComputedStyle(strip).flexDirection === 'row';
                if (!isHorizontalStrip || Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;
                strip.scrollLeft += event.deltaY;
                event.preventDefault();
            }, { passive: false });
        }

        map.on('click', (event) => {
            if (map.getLayer(ALL_HABITAT_CLUSTER_LAYER_ID)) {
                const clusterFeatures = map.queryRenderedFeatures(event.point, {
                    layers: [ALL_HABITAT_CLUSTER_LAYER_ID]
                });
                if (clusterFeatures.length) {
                    zoomToAllHabitatCluster(clusterFeatures[0]);
                    return;
                }
            }

            const queryLayers = [];
            if (map.getLayer(HABITAT_DOT_LAYER_ID)) queryLayers.push(HABITAT_DOT_LAYER_ID);
            if (map.getLayer(ALL_HABITAT_DOT_LAYER_ID)) queryLayers.push(ALL_HABITAT_DOT_LAYER_ID);
            if (!queryLayers.length) return;

            const features = map.queryRenderedFeatures(event.point, {
                layers: queryLayers
            });

            if (!features.length) return;

            const feature = features[0];
            const coordinates = feature.geometry.coordinates.slice();

            while (Math.abs(event.lngLat.lng - coordinates[0]) > 180) {
                coordinates[0] += event.lngLat.lng > coordinates[0] ? 360 : -360;
            }

            if (activeHabitatPopup) activeHabitatPopup.remove();

            activeHabitatPopup = new mapboxgl.Popup({ offset: 12, closeButton: true })
                .setLngLat(coordinates)
                .setHTML(getHabitatPopupHTML(feature.properties))
                .addTo(map)
                .on('close', () => {
                    activeHabitatPopup = null;
                });
        });

        map.on('mousemove', (event) => {
            const queryLayers = [];
            if (map.getLayer(ALL_HABITAT_CLUSTER_LAYER_ID)) queryLayers.push(ALL_HABITAT_CLUSTER_LAYER_ID);
            if (map.getLayer(HABITAT_DOT_LAYER_ID)) queryLayers.push(HABITAT_DOT_LAYER_ID);
            if (map.getLayer(ALL_HABITAT_DOT_LAYER_ID)) queryLayers.push(ALL_HABITAT_DOT_LAYER_ID);
            if (!queryLayers.length) {
                map.getCanvas().style.cursor = '';
                return;
            }

            const features = map.queryRenderedFeatures(event.point, {
                layers: queryLayers
            });
            map.getCanvas().style.cursor = features.length ? 'pointer' : '';
        });

        document.getElementById('panel-close').addEventListener('click', () => {
            document.getElementById('info-panel').classList.remove('visible');
            clearMigration();
            clearMarkers();
            document.querySelectorAll('.species-card').forEach(c => {
                c.classList.remove('active');
                c.setAttribute('aria-pressed', 'false');
            });
            activeCreature = null;
            showAllHabitatMarkers();
            map.flyTo({ center: [0, 20], zoom: 1.8, duration: 2000 });
        });

        map.on('load', async () => {
            loadHabitatIconImages();
            await loadLandData();
            buildSpeciesStrip();
            setupAllPinsToggle();
            showAllHabitatMarkers();
        });
    </script>
</body>
</html>
