<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Discourage stale-cache during development so the browser always
         revalidates the page (and its modules) instead of serving an old build.
         Without this, local servers like `python -m http.server` let the browser
         hold onto old JS, making fresh changes look like they "didn't apply". -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Ocean Explorers — Explore. Learn. Protect.</title>
    <meta name="description" content="Discover the wonders of marine life through interactive 3D exploration.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🌊</text></svg>">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="dns-prefetch" href="https://unpkg.com">
    </head>
<body>
    <canvas id="three-canvas"></canvas>

    <div id="loading-screen">
        <div class="loader-content">
            <div class="loader-ring"></div>
            <h2>OCEAN EXPLORERS</h2>
            <p>INITIALIZING OCEAN SCAN...</p>
        </div>
    </div>

    <div id="ui-overlay">
        <header class="top-bar">
            <div class="logo" id="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 40 40" width="36" height="36" style="color: var(--primary)">
                        <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.8"/>
                        <circle cx="20" cy="20" r="12" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4"/>
                        <circle cx="20" cy="20" r="4" fill="currentColor"/>
                        <line x1="20" y1="2" x2="20" y2="8" stroke="currentColor" stroke-width="1" opacity="0.6"/>
                        <line x1="20" y1="32" x2="20" y2="38" stroke="currentColor" stroke-width="1" opacity="0.6"/>
                        <line x1="2" y1="20" x2="8" y2="20" stroke="currentColor" stroke-width="1" opacity="0.6"/>
                        <line x1="32" y1="20" x2="38" y2="20" stroke="currentColor" stroke-width="1" opacity="0.6"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>OCEAN EXPLORERS</h1>
                    <p>EXPLORE. LEARN. PROTECT.</p>
                </div>
            </div>
            <div class="header-center" id="header-center"></div>
            <div class="explorer-profile" id="explorer-profile">
                <div class="profile-avatar">
                    <svg viewBox="0 0 36 36" width="32" height="32" style="color: var(--primary)">
                        <circle cx="18" cy="18" r="17" fill="var(--accent-soft)" stroke="currentColor" stroke-width="1"/>
                        <circle cx="18" cy="13" r="5" fill="currentColor" opacity="0.6"/>
                        <path d="M8 30 Q18 22 28 30" fill="currentColor" opacity="0.4"/>
                    </svg>
                </div>
                <div class="profile-info">
                    <span class="profile-name">EXPLORER-07</span>
                    <span class="profile-level">LEVEL 32 &middot; 12,450 XP</span>
                </div>
                <button class="icon-btn" id="btn-notifications" aria-label="Notifications">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                </button>
                <button class="icon-btn" id="btn-menu" aria-label="Menu">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
            </div>
        </header>

        <aside class="sidebar glass-panel" id="sidebar"></aside>

        <section class="central-display" id="central-display">
            <div class="creature-header" id="creature-header"></div>
            <div class="creature-description" id="creature-description"></div>
            <div class="creature-tags" id="creature-tags"></div>
            <div class="creature-image-area">
                <div class="creature-image-wrapper" id="creature-image"></div>
                <div id="creature-anatomy"></div>
            </div>
            <div id="anatomy-callouts"></div>
        </section>

        <aside class="right-panel" id="right-panel">
            <div class="species-overview glass-card" id="species-overview"></div>
            <div class="missions-panel glass-card" id="missions-panel"></div>
        </aside>

        <footer class="bottom-bar" id="bottom-bar">
            <div class="expedition-log" id="expedition-log"></div>
            <div class="action-buttons" id="action-buttons">
                <button class="action-btn primary" id="btn-explore">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
                    EXPLORE
                </button>
                <a href="map-2d.html" class="action-btn secondary" style="text-decoration:none">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 1 0-16 0c0 3 2.7 7 8 11.7z"/></svg>
                    HABITAT MAP
                </a>
            </div>
            <div class="pagination-dots" id="pagination-dots"></div>
        </footer>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
        }
    }
    </script>
    <!-- ?v bumps on each meaningful JS change to force the browser to fetch a
         fresh module graph (defeats stale caching on GitHub Pages + localhost). -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
